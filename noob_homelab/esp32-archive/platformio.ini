; ESP32 WiZ bulb + Spotify mood lighting controller
; See /Users/vikrant/.claude/plans/alright-create-a-plan-binary-pancake.md for the full design

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.2.0
